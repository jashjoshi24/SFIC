<!DOCTYPE html>

<html lang="en">
<head><script src="/theme.js"></script><script src="/api-config.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login | Surakshit Gujarat</title>
<style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #171411;
      color: #f7eee3;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: min(92%, 410px);
      padding: 34px;
      border: 1px solid #59432e;
      border-radius: 16px;
      background: #262019;
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #c8b8a5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #6b5945;
      border-radius: 8px;
      background: #171411;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #d97732;
      color: #171411;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #ffad91;
    }
  </style>
<link href="/brand-mark.svg" rel="icon" type="image/svg+xml"/><script src="/translations-data.js" defer></script>
<script src="/lang-engine.js" defer></script>
<link rel="stylesheet" href="/theme.css"></head>
<body class="sg-admin-login">
<div class="login-card">
<h2>Surakshit Gujarat</h2>
<p>Administrator Login</p>
<form id="adminLoginForm">
<label for="email">Admin Email</label>
<input autocomplete="username" id="email" required="" type="email"/>
<label for="password">Password</label>
<input autocomplete="current-password" id="password" required="" type="password"/>
<button id="loginButton" type="submit">Login as Admin</button>
<div id="message" role="alert"></div>
</form>
</div>
<script>
    const form = document.getElementById("adminLoginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const apiBase = (window.SFIC_API_BASE_URL || "").replace(/\/$/, "");
        const response = await fetch(`${apiBase}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.token || !data.admin) {
          throw new Error(data.message || "Invalid admin credentials");
        }

        sessionStorage.setItem("sfic_admin_token", data.token);
        sessionStorage.setItem("sfic_admin", JSON.stringify(data.admin));

        window.location.replace("/admin/index.html");
      } catch (error) {
        message.textContent = error instanceof TypeError
          ? "Unable to reach the server. Please try again when the backend is running."
          : error.message || "Login failed. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Login as Admin";
      }
    });
  </script>
</body>
</html>
